# 自动发布 Docker 镜像到 GHCR（ghcr.io）。
# 触发：推送 v* 格式的 tag（如 v1.0.1）→ 构建多架构镜像并推送。
# 鉴权用 Actions 内置 GITHUB_TOKEN，无需在仓库里配置任何 secret。
# 使用前仅需把仓库 Settings → Actions → General → Workflow permissions 设为
# 「Read and write permissions」（默认只读，写 packages 需要放开）。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag v1.2.3 → ghcr.io/<owner>/<repo>:1.2.3 + :1.2（latest 由语义化规则覆盖）
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
