# 主发布流程：定版本 → 联动三个独立打包（docker / ipkg / fpk）→ 汇总产物挂 Release。
# 触发：① push main 且 config.go 的 var Version 有变自动打 tag 发布；
# ② workflow_dispatch 手动（可指定版本）；③ push v* tag。
# 版本号经 -ldflags 编译期烙进二进制（不走运行时环境变量）；鉴权用内置 GITHUB_TOKEN。
# GITHUB_TOKEN 打的 tag 不触发新 run（防递归），故打 tag 与构建须串在本 workflow 内。
# 首次使用：Settings → Actions → Workflow permissions 设为 Read and write permissions。
name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.2.3；留空 = 使用 config.go 里的 var Version）"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # 确定要发布的版本：手动输入 > config.go 默认值 > （tag 触发时跳过本 job）。
  # 版本对应的 tag 已存在则视为「已发布过」，跳过发布，避免重复覆盖。
  resolve:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}
    outputs:
      version: ${{ steps.v.outputs.version }} # 形如 v1.2.3；未发布时为空
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史来比对已有 tag

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
          else
            VER=$(grep -oP 'var Version = "\K[^"]+' config/config.go)
            echo "从 config.go 读到版本: $VER"
          fi
          TAG="v${VER#v}" # 统一成 v 前缀
          if git tag -l | grep -qx "$TAG"; then
            echo "$TAG 已存在（版本未变更或已发布过），跳过发布"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

  # 三个独立打包（可复用 workflow），既能被本流程联动，也能各自手动触发。
  # tag 触发时 resolve 被跳过（tag 已存在），version 回退到 github.ref_name。
  docker:
    uses: ./.github/workflows/_docker.yml
    needs: resolve
    if: ${{ !cancelled() && (needs.resolve.result == 'skipped' || needs.resolve.outputs.version != '') }}
    with:
      version: ${{ needs.resolve.outputs.version || github.ref_name }}

  ipkg:
    uses: ./.github/workflows/_ipkg.yml
    needs: docker # ipkg 内嵌镜像，须等待镜像推送到 GHCR
    if: ${{ !cancelled() && (needs.resolve.result == 'skipped' || needs.resolve.outputs.version != '') }}
    with:
      version: ${{ needs.resolve.outputs.version || github.ref_name }}

  fpk:
    uses: ./.github/workflows/_fpk.yml
    needs: resolve # fpk 仅引用 GHCR 镜像，不内嵌，可与 docker 并行
    if: ${{ !cancelled() && (needs.resolve.result == 'skipped' || needs.resolve.outputs.version != '') }}
    with:
      version: ${{ needs.resolve.outputs.version || github.ref_name }}

  # 汇总三个打包产物，生成更新说明并挂到 Release。
  release:
    runs-on: ubuntu-latest
    needs: [docker, ipkg, fpk]
    if: ${{ !cancelled() && (needs.resolve.result == 'skipped' || needs.resolve.outputs.version != '') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Release 说明：上一 tag 到本 tag 的 commit 列表 + 镜像/包信息（单点维护，不引入 CHANGELOG.md）
      - name: Generate release notes
        env:
          VERSION: ${{ needs.resolve.outputs.version || github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${VERSION}"
          else
            RANGE="${VERSION}" # 首个 Release：取该 tag 所含全部提交
          fi
          {
            echo "## 更新内容"
            echo ""
            git log --no-merges --pretty=format:"- %s (%h)" "$RANGE" || echo "- 首个版本"
          } > release-notes.md
          cat >> release-notes.md <<EOF

          ## 镜像

          \`\`\`
          docker pull ghcr.io/praxigen/cert-web-ui:${VERSION}
          \`\`\`

          多架构（amd64 + arm64），\`latest\` 与本版本同步更新。

          ## iKuai 应用市场

          附件 \`.ipkg\` 为 iKuai 离线安装包（内嵌 amd64 镜像），可在应用商店离线安装导入。

          ## 飞牛 fnOS 应用中心

          附件 \`.fpk\` 为飞牛 fnOS 应用中心离线包，可在应用中心手动安装导入。
          EOF

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version || github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/ipkg/*.ipkg
            artifacts/fpk/*.fpk
