# 自动发布 Docker 镜像到 GHCR。触发：① push main 且 config.go 的 var Version 有变自动打 tag 发布；
# ② workflow_dispatch 手动（可指定版本）；③ push v* tag。
# 版本号经 -ldflags 编译期烙进二进制（不走运行时环境变量）；鉴权用内置 GITHUB_TOKEN。
# GITHUB_TOKEN 打的 tag 不触发新 run（防递归），故打 tag 与构建须串在本 workflow 内。
# 首次使用：Settings → Actions → Workflow permissions 设为 Read and write permissions。
name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.2.3；留空 = 使用 config.go 里的 var Version）"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # 确定要发布的版本：手动输入 > config.go 默认值 > （tag 触发时跳过本 job）。
  # 版本对应的 tag 已存在则视为「已发布过」，跳过发布，避免重复覆盖。
  resolve:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || github.ref_type != 'tag' }}
    outputs:
      version: ${{ steps.v.outputs.version }} # 形如 v1.2.3；未发布时为空
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史来比对已有 tag

      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VER="$INPUT_VERSION"
          else
            VER=$(grep -oP 'var Version = "\K[^"]+' config/config.go)
            echo "从 config.go 读到版本: $VER"
          fi
          TAG="v${VER#v}" # 统一成 v 前缀
          if git tag -l | grep -qx "$TAG"; then
            echo "$TAG 已存在（版本未变更或已发布过），跳过发布"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

  docker:
    runs-on: ubuntu-latest
    needs: resolve
    # tag 触发时 resolve 被跳过（tag 已存在），直接用 ref 名构建；
    # main push / 手动触发时必须拿到 resolve 产出的新版本号，否则（版本未变）不发布。
    if: ${{ !cancelled() && (needs.resolve.result == 'skipped' || needs.resolve.outputs.version != '') }}
    env:
      VERSION: ${{ needs.resolve.outputs.version || github.ref_name }}
    steps:
      # fetch-depth: 0 需要完整历史与全部 tag，供生成「上一版本..本版本」的更新说明
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # GHCR 镜像名必须全小写，而 github.repository 保留原始大小写（如 PraxiGEN/...），
      # 手动拼 tag 不会自动转换，须显式小写化。
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # 构建定义位于 docker/，构建上下文仍为仓库根（Dockerfile 需 COPY 源码）
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # v1.2.3 → ghcr.io/praxigen/cert-web-ui:v1.2.3 与 :latest
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ env.VERSION }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # iKuai 应用市场离线安装包：镜像发布后拉回 amd64 版内嵌出包，挂到 Release。
      # iKuai 路由以 x86 为主，包内嵌 amd64 镜像（arm64 镜像仍正常发布在 GHCR）。
      - name: Package iKuai ipkg
        env:
          IMAGE: ghcr.io/${{ steps.repo.outputs.name }}:${{ env.VERSION }}
        run: |
          docker pull "$IMAGE"
          cp -r ipkg ipkg-build
          cd ipkg-build
          IMAGE="$IMAGE" PKG_VERSION="${VERSION#v}" bash build-ipkg.sh

      # Release 说明：上一 tag 到本 tag 的 commit 列表 + 镜像信息（单点维护，不引入 CHANGELOG.md）
      - name: Generate release notes
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${VERSION}"
          else
            RANGE="${VERSION}" # 首个 Release：取该 tag 所含全部提交
          fi
          {
            echo "## 更新内容"
            echo ""
            git log --no-merges --pretty=format:"- %s (%h)" "$RANGE" || echo "- 首个版本"
          } > release-notes.md
          cat >> release-notes.md <<EOF

          ## 镜像

          \`\`\`
          docker pull ghcr.io/praxigen/cert-web-ui:${VERSION}
          \`\`\`

          多架构（amd64 + arm64），\`latest\` 与本版本同步更新。

          ## iKuai 应用市场

          附件 \`.ipkg\` 为 iKuai 离线安装包（内嵌 amd64 镜像），可在应用商店离线安装导入。
          EOF

      - name: Upload ipkg to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          body_path: release-notes.md
          files: ipkg-build/*.ipkg
